name: Gateway Vessel Schedule Scraper

on:
  schedule:
    # Runs at 05:00, 11:00, 17:00, and 23:00 AEST (01:00, 07:00, 13:00, 19:00 UTC)
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  scrape_and_export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl beautifulsoup4 requests
          playwright install --with-deps chromium

      - name: Run Scraper Script
        env:
          GATEWAY_USERNAME: ${{ secrets.GATEWAY_USERNAME }}
          GATEWAY_PASSWORD: ${{ secrets.GATEWAY_PASSWORD }}
        run: python gateway_scraper.py

      - name: Push to SharePoint Webhook
        env:
          SHAREPOINT_WEBHOOK_URL: ${{ secrets.SHAREPOINT_WEBHOOK_URL }}
        run: |
          python -c "
          import requests, os
          url = os.environ.get('SHAREPOINT_WEBHOOK_URL')
          file_path = 'Gateway_Vessel_Schedule.xlsx'
          if url and os.path.exists(file_path):
              with open(file_path, 'rb') as f:
                  res = requests.post(url, data=f.read(), headers={'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
              print(f'SharePoint Webhook Response Code: {res.status_code}')
              if res.status_code >= 400:
                  print(f'WARNING: Power Automate returned non-success response: {res.text}')
                  exit(1)
          else:
              print('Webhook URL or file missing.')
              exit(1)
          "
