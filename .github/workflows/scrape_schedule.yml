name: Gateway Vessel Schedule Scraper

on:
  schedule:
    # Runs at 05:00, 11:00, 17:00, and 23:00 AEST (01:00, 07:00, 13:00, 19:00 UTC)
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub Actions UI

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permission to commit database and excel changes back to repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright beautifulsoup4 requests

      - name: Install Playwright Browsers with System Dependencies
        run: |
          npx playwright install chromium --with-deps

      - name: Run Scraper Script
        env:
          GATEWAY_USERNAME: ${{ secrets.GATEWAY_USERNAME }}
          GATEWAY_PASSWORD: ${{ secrets.GATEWAY_PASSWORD }}
          CI: 'true'
        run: |
          python gateway_scraper.py

      - name: Commit Updated Database & Excel Back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gateway_vessel_schedule.db Gateway_Vessel_Schedule.xlsx
          git commit -m "Auto-update historical schedule database and Excel [skip ci]" || echo "No changes to commit"
          git push

      - name: Send Updated Excel to SharePoint via Power Automate Webhook
        env:
          WEBHOOK_URL: ${{ secrets.SHAREPOINT_WEBHOOK_URL }}
        run: |
          python -c "
          import os, requests, base64

          url = os.getenv('WEBHOOK_URL')
          file_path = 'Gateway_Vessel_Schedule.xlsx'

          if not url:
              print('SHAREPOINT_WEBHOOK_URL secret is not set. Skipping SharePoint upload.')
          elif not os.path.exists(file_path):
              print('Output file Gateway_Vessel_Schedule.xlsx not found. Skipping SharePoint upload.')
          else:
              with open(file_path, 'rb') as f:
                  encoded_content = base64.b64encode(f.read()).decode('utf-8')

              payload = {
                  'fileName': file_path,
                  'fileContent': encoded_content
              }
              
              res = requests.post(url, json=payload)
              print(f'SharePoint Webhook Response Code: {res.status_code}')
              if res.status_code in [200, 202]:
                  print('SUCCESS: File delivered to Power Automate for SharePoint upload.')
              else:
                  print(f'WARNING: Power Automate returned non-success response: {res.text}')
                  exit(1)
          "

      - name: Upload Excel Output as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gateway_Vessel_Schedule
          path: Gateway_Vessel_Schedule.xlsx
          retention-days: 14
